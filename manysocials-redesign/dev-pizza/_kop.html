<script>
  // Intro: de animaties staan klaar maar wachten tot de lettertypes er zijn (of hooguit 1,4 s).
  (() => {
    const r = document.documentElement;
    try { if (localStorage.getItem('ms-thema') === 'donker') r.classList.add('donker'); } catch (e) {}
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    r.classList.add('intro');
    const start = () => r.classList.add('start');
    setTimeout(start, 1400);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(start, 60));
  })();
</script>
