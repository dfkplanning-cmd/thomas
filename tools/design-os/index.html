<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design OS</title>
<style>
  :root {
    --bg: #f3f0e9; --surface: #fbfaf6; --sunk: #ebe7de; --text: #1c1a17; --muted: #6d675e;
    --line: #dfd9cd; --accent: #e8590c; --accent-text: #fff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12110f; --surface: #1b1a17; --sunk: #0d0c0b; --text: #eeeae2; --muted: #9a948a;
      --line: #2d2b27; --accent: #ff7a33; --accent-text: #12110f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12110f; --surface: #1b1a17; --sunk: #0d0c0b; --text: #eeeae2; --muted: #9a948a;
    --line: #2d2b27; --accent: #ff7a33; --accent-text: #12110f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: grid; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; display: flex; gap: 9px; align-items: center; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
  .muted { color: var(--muted); }
  input[type=search] { flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab, .ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 20px 24px 60px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 4 / 3; background: var(--sunk); position: relative; overflow: hidden; cursor: zoom-in; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.contain img { object-fit: contain; padding: 18px; }
  .thumb iframe { width: 400%; height: 400%; border: 0; transform: scale(.25); transform-origin: 0 0; pointer-events: none; background: #fff; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgb(0 0 0 / .6); color: #fff; font-size: 11px;
    padding: 2px 7px; border-radius: 999px; letter-spacing: .02em; }
  .info { padding: 10px 12px 12px; display: grid; gap: 6px; flex: 1; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .desc { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .swatches { display: flex; gap: 4px; }
  .swatches span { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; }
  .actions { display: flex; gap: 6px; margin-top: auto; }
  .actions button { font-size: 12px; padding: 4px 10px; }
  .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .empty { padding: 80px 24px; text-align: center; color: var(--muted); }
  .empty code { background: var(--sunk); padding: 2px 6px; border-radius: 6px; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 95vw; max-height: 95vh; }
  dialog::backdrop { background: rgb(0 0 0 / .75); }
  dialog img, dialog video { max-width: 95vw; max-height: 90vh; display: block; border-radius: 8px; }
  dialog iframe { width: 90vw; height: 88vh; border: 0; border-radius: 8px; background: #fff; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) { header, .grid { padding-left: 16px; padding-right: 16px; } .grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1><span class="dot"></span>Design OS <span id="count" class="muted"></span></h1>
    <span id="updated" class="muted"></span>
    <button id="theme" class="ghost" title="Licht of donker">◐</button>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="Zoek op wat erin staat, naam, kleur (#e8590c) of tag" autofocus>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="grid" class="grid"></main>
<div id="empty" class="empty" hidden></div>
<dialog id="viewer"></dialog>
<div id="toast" class="toast"></div>

<script>
const CATS = [
  ["alles", "Alles"], ["ontwerp", "Ontwerpen"], ["beeld", "Beelden"], ["video", "Video"],
  ["element", "Elementen"], ["referentie", "Referenties"],
];
let items = [], cat = "alles", focus = "inhoud";
const $ = (id) => document.getElementById(id);
const fileUrl = (it) => `/file?id=${it.id}`;

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 1600);
}

function hexDist(a, b) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
}

function score(it, words) {
  // Gewichten hangen af van waar je het meest op zoekt (config: search_focus).
  const w = { inhoud: [3, 1, 2], naam: [1, 3, 1], tags: [1, 1, 3], kleur: [1, 1, 1] }[focus] || [3, 1, 2];
  const content = [it.description, it.note, it.kind, it.title].join(" ").toLowerCase();
  const name = [it.name, it.folder, it.site].join(" ").toLowerCase();
  const tags = [...(it.ai_tags || []), ...(it.tags || [])].join(" ").toLowerCase();
  let total = 0;
  for (const word of words) {
    if (/^#[0-9a-f]{6}$/.test(word)) {
      const best = Math.min(...(it.colors || []).map((c) => hexDist(c.toLowerCase(), word)), 999);
      if (best > 90) return 0;
      total += (focus === "kleur" ? 6 : 3) * (1 - best / 90);
      continue;
    }
    const s = (content.includes(word) ? w[0] : 0) + (name.includes(word) ? w[1] : 0) + (tags.includes(word) ? w[2] : 0);
    if (!s) return 0;
    total += s;
  }
  return total;
}

function thumb(it) {
  const el = document.createElement("div");
  el.className = "thumb";
  const ext = it.ext;
  if (["png", "jpg", "jpeg", "webp", "gif", "avif"].includes(ext)) {
    el.innerHTML = `<img loading="lazy" alt="">`;
    el.querySelector("img").src = fileUrl(it);
  } else if (ext === "svg") {
    el.classList.add("contain");
    el.innerHTML = `<img loading="lazy" alt="">`;
    el.querySelector("img").src = fileUrl(it);
  } else if (["mp4", "mov", "webm", "m4v"].includes(ext)) {
    el.innerHTML = `<video muted loop playsinline preload="metadata"></video>`;
    const v = el.querySelector("video");
    v.src = fileUrl(it) + "#t=1";
    el.addEventListener("mouseenter", () => v.play().catch(() => {}));
    el.addEventListener("mouseleave", () => v.pause());
  } else if (ext === "html" || ext === "htm") {
    el.innerHTML = `<iframe loading="lazy" sandbox="allow-same-origin" tabindex="-1"></iframe>`;
    el.querySelector("iframe").src = fileUrl(it);
  } else {
    el.innerHTML = `<div style="display:grid;place-items:center;height:100%;font-size:28px" class="muted"></div>`;
    el.firstChild.textContent = it.lottie ? "Lottie" : ext.toUpperCase();
  }
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = it.kind || it.category;
  el.appendChild(badge);
  el.addEventListener("click", () => openViewer(it));
  return el;
}

function openViewer(it) {
  const d = $("viewer");
  d.innerHTML = "";
  const ext = it.ext;
  let node;
  if (["mp4", "mov", "webm", "m4v"].includes(ext)) {
    node = document.createElement("video");
    node.controls = true; node.autoplay = true;
  } else if (ext === "html" || ext === "htm") {
    node = document.createElement("iframe");
  } else {
    node = document.createElement("img");
  }
  node.src = fileUrl(it);
  d.appendChild(node);
  d.showModal();
}
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) $("viewer").close(); });

async function copyForClaude(it) {
  const ext = it.ext;
  try {
    if (["png", "jpg", "jpeg", "webp", "gif", "avif"].includes(ext)) {
      // Als PNG naar het klembord, zodat je het direct in een Claude-chat plakt.
      const img = new Image();
      img.src = fileUrl(it);
      await img.decode();
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext("2d").drawImage(img, 0, 0);
      const blob = await new Promise((r) => c.toBlob(r, "image/png"));
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      return toast("Beeld gekopieerd. Plak het in Claude.");
    }
    if (ext === "svg" || ext === "html" || ext === "htm" || it.lottie) {
      const text = await (await fetch(fileUrl(it))).text();
      const lang = ext === "json" ? "json" : ext === "svg" ? "svg" : "html";
      await navigator.clipboard.writeText(`Bestand: ${it.path}\n\n\`\`\`${lang}\n${text}\n\`\`\``);
      return toast("Code gekopieerd. Plak het in Claude.");
    }
  } catch (err) { /* val terug op het pad */ }
  await navigator.clipboard.writeText(`Gebruik dit bestand: ${it.path}${it.description ? "\nInhoud: " + it.description : ""}`);
  toast("Pad gekopieerd.");
}

function tile(it) {
  const t = document.createElement("article");
  t.className = "tile";
  t.appendChild(thumb(it));
  const info = document.createElement("div");
  info.className = "info";
  info.innerHTML = `<div class="name"></div><div class="desc"></div><div class="swatches"></div>
    <div class="actions"><button class="ghost primary copy">Kopieer voor Claude</button><button class="ghost path">Pad</button></div>`;
  info.querySelector(".name").textContent = it.title || it.name;
  info.querySelector(".name").title = it.path;
  info.querySelector(".desc").textContent = it.description || it.note || "map: " + it.folder.split(/[\\/]/).slice(-2).join("/");
  for (const c of it.colors || []) {
    const s = document.createElement("span");
    s.style.background = c; s.title = c;
    s.addEventListener("click", () => { $("q").value = c; render(); });
    info.querySelector(".swatches").appendChild(s);
  }
  info.querySelector(".copy").addEventListener("click", () => copyForClaude(it));
  info.querySelector(".path").addEventListener("click", async () => {
    await navigator.clipboard.writeText(it.path); toast("Pad gekopieerd.");
  });
  t.appendChild(info);
  return t;
}

function renderTabs() {
  const counts = { alles: items.length };
  for (const it of items) counts[it.category] = (counts[it.category] || 0) + 1;
  $("tabs").innerHTML = "";
  for (const [key, label] of CATS) {
    if (key !== "alles" && !counts[key]) continue;
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("aria-pressed", key === cat);
    b.textContent = `${label} ${counts[key] || 0}`;
    b.addEventListener("click", () => { cat = key; renderTabs(); render(); });
    $("tabs").appendChild(b);
  }
}

function render() {
  const words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = items.filter((it) => cat === "alles" || it.category === cat);
  if (words.length) {
    list = list.map((it) => [score(it, words), it]).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).map(([, it]) => it);
  } else {
    list.sort((a, b) => b.mtime - a.mtime);
  }
  $("count").textContent = `${list.length} / ${items.length}`;
  const grid = $("grid");
  grid.innerHTML = "";
  list.slice(0, 600).forEach((it) => grid.appendChild(tile(it)));
  $("empty").hidden = items.length > 0;
}

function applyTheme(theme) {
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
}
$("theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("design-os-theme", next); } catch {}
});

$("q").addEventListener("input", render);
addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });

(async () => {
  const data = await (await fetch("/api/index")).json();
  items = data.items;
  focus = data.search_focus;
  let saved = null;
  try { saved = localStorage.getItem("design-os-theme"); } catch {}
  applyTheme(saved || data.theme);
  if (data.updated) $("updated").textContent = "index: " + new Date(data.updated).toLocaleString("nl-NL");
  $("empty").innerHTML = "Nog niets geïndexeerd. Draai <code>python3 tools/design-os/design_os.py init</code> en daarna <code>index</code>.";
  renderTabs();
  render();
})();
</script>
</body>
</html>
