<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Unbounded:wght@600;800&display=swap">
<style>body{margin:0;background:#e9e9e4;font:14px sans-serif;padding:20px}.rij{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:24px}.rij div{filter:drop-shadow(0 14px 18px rgba(0,0,0,.25))}svg{width:100%;display:block}</style>
<div id="b"></div>
<script src="zakken.js"></script>
<script>
document.fonts.ready.then(()=>{
const b=document.getElementById('b');
for(const m of ['knap','zilt','golf']){const r=document.createElement('div');r.className='rij';
for(let i=0;i<5;i++){r.insertAdjacentHTML('beforeend','<div>'+Zak.svg(m,i)+'</div>')}
r.insertAdjacentHTML('beforeend','<div>'+Zak.svg(m,0,{naam:'Sanne'})+'</div>');b.appendChild(r)}});
</script>
